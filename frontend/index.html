<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Verification System</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Biometric Identity Verification</h1>

  <!-- User Registration & OTP -->
  <section>
    <h2>User Registration</h2>
    <input type="text" id="name" placeholder="Full Name"><br>
    <input type="text" id="phone" placeholder="Phone (10 digits)"><br>
    <input type="number" id="age" placeholder="Age"><br>
    <input type="text" id="gender" placeholder="Gender"><br>
    <input type="email" id="email" placeholder="Email"><br>
    <button id="registerBtn">Register</button>
  </section>

  <section>
    <h2>OTP Verification</h2>
    <input type="text" id="sessionId" placeholder="Session ID"><br>
    <input type="text" id="otp" placeholder="Enter OTP"><br>
    <button id="verifyOtpBtn">Verify OTP</button>
  </section>

  <!-- Liveness -->
  <section>
    <h2>Liveness Detection</h2>
    <button id="startLivenessBtn">Start Liveness</button>
    <p id="livenessStatus"></p>
  </section>

  <!-- Aadhaar Upload -->
  <section>
    <h2>Upload Aadhaar</h2>
    <input type="file" id="aadhaarFile"><br>
    <button id="verifyBtn">Verify Identity</button>
  </section>

  <p id="result"></p>

  <script src="/static/script.js"></script>
</body>
</html>
